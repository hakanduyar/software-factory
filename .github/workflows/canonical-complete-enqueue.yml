name: Canonical COMPLETE enqueue
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  canonical-complete-enqueue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Verify enqueue without publication
        shell: pwsh
        run: |
          pwsh -NoProfile -File (Join-Path $env:GITHUB_WORKSPACE 'tests/github/canonical-complete-enqueue.tests.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
