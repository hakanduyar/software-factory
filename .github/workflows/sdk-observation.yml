name: SDK observation regressions
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  sdk-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Verify standalone SDK observation
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'authoring/continuation/dispatch/managed-native-sdk-observation.ps1'
          $tests = Join-Path $env:GITHUB_WORKSPACE 'authoring/continuation/tests/sdk-observation.tests.ps1'
          & $tests -SourcePath $source -OutputDirectory (Join-Path $env:RUNNER_TEMP 'sdk-observation')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
