name: Publisher diagnostic regressions
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  publisher-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: Verify safe publisher diagnostics without GitHub calls
        shell: pwsh
        run: |
          $tests = Join-Path $env:GITHUB_WORKSPACE 'tests/github/publisher-stderr.tests.ps1'
          & $tests -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'publisher-diagnostics')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
